<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr Sonrisas - Panel de Conversaciones</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    .header { background: #075e54; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 20px; }
    .header .status { font-size: 12px; opacity: 0.8; }
    .container { display: flex; height: calc(100vh - 60px); }
    .sidebar { width: 320px; background: white; border-right: 1px solid #e0e0e0; overflow-y: auto; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #e0e0e0; font-weight: bold; color: #075e54; }
    .contact { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
    .contact:hover { background: #f5f5f5; }
    .contact.active { background: #e8f5e9; }
    .contact-avatar { width: 44px; height: 44px; border-radius: 50%; background: #075e54; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: bold; font-size: 14px; }
    .contact-preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .contact-time { font-size: 11px; color: #999; flex-shrink: 0; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { background: #075e54; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .chat-header .avatar { width: 40px; height: 40px; border-radius: 50%; background: #128c7e; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #e5ddd5; }
    .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #666; font-size: 16px; }
    .message { margin-bottom: 8px; display: flex; flex-direction: column; }
    .message.user { align-items: flex-start; }
    .message.bot { align-items: flex-end; }
    .message-bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .message.user .message-bubble { background: white; border-top-left-radius: 0; }
    .message.bot .message-bubble { background: #dcf8c6; border-top-right-radius: 0; }
    .message-time { font-size: 11px; color: #999; margin-top: 2px; padding: 0 4px; }
    .message-sender { font-size: 11px; color: #075e54; font-weight: bold; margin-bottom: 2px; padding: 0 4px; }
    .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
    .no-chat-text { text-align: center; color: #666; }
    .no-chat-text h2 { font-size: 24px; margin-bottom: 8px; }
    .badge { background: #25d366; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; margin-left: auto; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🦷 Dr Sonrisas — Panel de Conversaciones</h1>
      <div class="status" id="status">Conectando...</div>
    </div>
  </div>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">Conversaciones</div>
      <div id="contacts"></div>
    </div>
    <div class="chat-area" id="chat-area">
      <div class="no-chat">
        <div class="no-chat-text">
          <h2>💬</h2>
          <p>Selecciona una conversación</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let conversaciones = {};
    let contactoActivo = null;

    socket.on("connect", () => {
      document.getElementById("status").textContent = "● Conectado en tiempo real";
    });

    socket.on("disconnect", () => {
      document.getElementById("status").textContent = "● Desconectado";
    });

    socket.on("historial", (data) => {
      conversaciones = data;
      renderContactos();
      if (contactoActivo) renderChat(contactoActivo);
    });

    socket.on("nuevo_mensaje", (data) => {
      const { telefono, mensaje } = data;
      if (!conversaciones[telefono]) conversaciones[telefono] = [];
      conversaciones[telefono].push(mensaje);
      renderContactos();
      if (contactoActivo === telefono) renderChat(telefono);
    });

    function formatTelefono(tel) {
      return "+" + tel;
    }

    function formatHora(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    }

    function formatFecha(ts) {
      const d = new Date(ts);
      const hoy = new Date();
      if (d.toDateString() === hoy.toDateString()) return formatHora(ts);
      return d.toLocaleDateString("es-MX", { day: "2-digit", month: "2-digit" });
    }

    function renderContactos() {
      const container = document.getElementById("contacts");
      const telefonos = Object.keys(conversaciones);
      if (telefonos.length === 0) {
        container.innerHTML = '<div style="padding:16px;color:#999;text-align:center">Sin conversaciones aún</div>';
        return;
      }
      container.innerHTML = telefonos.map(tel => {
        const msgs = conversaciones[tel];
        const ultimo = msgs[msgs.length - 1];
        const noLeidos = msgs.filter(m => m.tipo === "usuario" && !m.leido).length;
        return `
          <div class="contact ${contactoActivo === tel ? 'active' : ''}" onclick="seleccionarContacto('${tel}')">
            <div class="contact-avatar">👤</div>
            <div class="contact-info">
              <div class="contact-name">${formatTelefono(tel)}</div>
              <div class="contact-preview">${ultimo ? ultimo.texto.substring(0, 40) : ''}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <div class="contact-time">${ultimo ? formatFecha(ultimo.timestamp) : ''}</div>
              ${noLeidos > 0 ? `<div class="badge">${noLeidos}</div>` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    function seleccionarContacto(tel) {
      contactoActivo = tel;
      if (conversaciones[tel]) {
        conversaciones[tel].forEach(m => m.leido = true);
      }
      renderContactos();
      renderChat(tel);
    }

    function renderChat(tel) {
      const msgs = conversaciones[tel] || [];
      document.getElementById("chat-area").innerHTML = `
        <div class="chat-header">
          <div class="avatar">👤</div>
          <div>
            <div style="font-weight:bold">${formatTelefono(tel)}</div>
            <div style="font-size:12px;opacity:0.8">${msgs.length} mensajes</div>
          </div>
        </div>
        <div class="chat-messages" id="messages-container">
          ${msgs.length === 0
            ? '<div class="empty-state">Sin mensajes</div>'
            : msgs.map(m => `
              <div class="message ${m.tipo === 'usuario' ? 'user' : 'bot'}">
                <div class="message-sender">${m.tipo === 'usuario' ? '👤 Paciente' : '🤖 Dr Sonrisas'}</div>
                <div class="message-bubble">${m.texto.replace(/\n/g, '<br>')}</div>
                <div class="message-time">${formatHora(m.timestamp)}</div>
              </div>
            `).join("")}
        </div>
      `;
      const container = document.getElementById("messages-container");
      if (container) container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
